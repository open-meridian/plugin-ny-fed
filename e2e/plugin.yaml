# The e2e's addition to the harness's plugins (the harness's README, "The
# plugins"): the plugin given a hosts file in which the NY Fed's API answers
# nowhere, so the run reads only the answer committed with it, in sample
# data. The path is absolute, from E2E_DIR, since a later compose file's
# relative paths resolve against the first file's directory.
services:
  ny-fed:
    volumes:
      - ${E2E_DIR:?set E2E_DIR to this directory, absolute}/hosts:/etc/hosts:ro
